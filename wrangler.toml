name = "hot-seat-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Daily cleanup of old vote rows (UTC). Free tier includes cron triggers.
[triggers]
crons = ["17 9 * * *"]

# All configuration values are set as secrets in production:
